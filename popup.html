<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      color: #222;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .stats {
      font-size: 13px;
      color: #6a6a6a;
      margin-bottom: 16px;
    }
    .stats strong {
      color: #222;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      transition: background 0.1s ease;
    }
    button:hover {
      background: #f7f7f7;
    }
    button.danger {
      color: #c13515;
      border-color: #ffd3cd;
    }
    button.danger:hover {
      background: #fff8f6;
    }
    .empty {
      font-size: 13px;
      color: #6a6a6a;
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>
  <h1>Airbnb Listing Hider</h1>
  <div class="stats" id="stats">Loading...</div>
  <div class="actions" id="actions"></div>
  <script src="popup.js"></script>
</body>
</html>
