<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Airbnb Listing Hider — Manage Hidden Listings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 32px;
      max-width: 800px;
      margin: 0 auto;
      color: #222;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #6a6a6a;
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    button:hover {
      background: #f7f7f7;
    }
    button.danger {
      color: #c13515;
      border-color: #ffd3cd;
    }
    button.danger:hover {
      background: #fff8f6;
    }
    .listing-table {
      width: 100%;
      border-collapse: collapse;
    }
    .listing-table th,
    .listing-table td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }
    .listing-table th {
      font-weight: 600;
      color: #6a6a6a;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .listing-table tr:hover {
      background: #f7f7f7;
    }
    .listing-id {
      font-family: monospace;
      font-size: 12px;
      color: #6a6a6a;
    }
    .listing-link {
      color: #008489;
      text-decoration: none;
    }
    .listing-link:hover {
      text-decoration: underline;
    }
    .remove-btn {
      padding: 4px 10px;
      font-size: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
    }
    .remove-btn:hover {
      background: #fff8f6;
      border-color: #ffd3cd;
      color: #c13515;
    }
    .empty {
      text-align: center;
      padding: 48px 0;
      color: #6a6a6a;
      font-size: 14px;
    }
    .export-area {
      display: none;
      margin-top: 16px;
    }
    .export-area textarea {
      width: 100%;
      height: 120px;
      font-family: monospace;
      font-size: 12px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      resize: vertical;
    }
    .export-area p {
      font-size: 12px;
      color: #6a6a6a;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>Hidden Listings</h1>
  <p class="subtitle" id="subtitle">Loading...</p>

  <div class="actions" id="actions">
    <button id="export-btn">Export</button>
    <button id="import-btn">Import</button>
    <button id="clear-btn" class="danger">Clear All</button>
  </div>

  <div class="export-area" id="export-area">
    <textarea id="export-text" readonly></textarea>
    <p>Copy the JSON above to back up your hidden listings. Use Import to restore.</p>
  </div>

  <div id="content"></div>

  <input type="file" id="import-file" accept=".json,.txt" style="display:none">

  <script src="manage.js"></script>
</body>
</html>
